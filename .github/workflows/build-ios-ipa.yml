name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-ios-ipa.yml"
      - "global.json"
      - "vault.iOS/**"
      - "vault.iOS.Shared/**"
      - "vault.iOS.ShareExtension/**"
      - "vault.Core/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Compute iOS version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MARKETING_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' vault.iOS/vault.iOS.csproj | head -n 1)
          if [ -z "${MARKETING_VERSION:-}" ]; then
            echo "Impossibile leggere ApplicationDisplayVersion da vault.iOS.csproj"
            exit 1
          fi

          BUILD_NUMBER="${{ github.run_number }}"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Versione iOS: $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Install iOS workload
        run: dotnet workload install ios --skip-manifest-update

      - name: Restore iOS app projects
        run: |
          dotnet restore vault.iOS.Shared/vault.iOS.Shared.csproj
          dotnet restore vault.iOS/vault.iOS.csproj
          dotnet restore vault.iOS.ShareExtension/vault.iOS.ShareExtension.csproj

      - name: Publish iOS IPA (unsigned)
        id: publish
        continue-on-error: true
        run: |
          dotnet publish vault.iOS/vault.iOS.csproj \
            -f net8.0-ios16.4 \
            -c Release \
            -r ios-arm64 \
            --no-restore \
            -p:BuildIpa=true \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.marketing_version }} \
            -p:ApplicationVersion=${{ steps.version.outputs.build_number }} \
            -p:EnableCodeSigning=false \
            -p:CheckEolWorkloads=false \
            -p:CheckEolTargetFramework=false \
            -fl \
            "-flp:logfile=publish-ios.log;verbosity=diagnostic" \
            -bl:publish-ios.binlog

      - name: Upload iOS publish binlog
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-publish-binlog
          path: publish-ios.binlog
          if-no-files-found: ignore

      - name: Upload iOS publish text log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-publish-log
          path: publish-ios.log
          if-no-files-found: ignore

      - name: Summarize publish errors
        if: always()
        shell: bash
        run: |
          if [ ! -f publish-ios.log ]; then
            echo "publish-ios.log non trovato."
            exit 0
          fi

          echo "Esito step publish: ${{ steps.publish.outcome }}"
          echo "Prime righe contenenti error/warning:"
          grep -Ein "error|warning" publish-ios.log | tail -n 200 || true

      - name: Inspect share extension build output
        if: always()
        shell: bash
        run: |
          echo "Contenuto output extension:"
          if [ ! -d "vault.iOS.ShareExtension/bin" ]; then
            echo "La cartella vault.iOS.ShareExtension/bin non esiste."
            exit 0
          fi

          find vault.iOS.ShareExtension/bin -maxdepth 6 | sed 's/^/ - /'
          APPEX_PATH=$(find vault.iOS.ShareExtension/bin -type d -name "*.appex" | head -n 1 || true)
          if [ -n "$APPEX_PATH" ]; then
            echo "Extension bundle trovato: $APPEX_PATH"
          else
            echo "Nessun .appex trovato nell'output del progetto extension."
          fi

      - name: Locate IPA
        if: always()
        id: locate
        shell: bash
        run: |
          IPA_PATH=$(find vault.iOS/bin/Release -type f -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "IPA non trovata."
            find vault.iOS/bin/Release -maxdepth 6 -type f | sed 's/^/ - /'
            exit 1
          fi
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA_PATH"

      - name: Inspect app bundle for extensions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find vault.iOS/bin/Release -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle non trovato nel publish output."
            find vault.iOS/bin/Release -maxdepth 6 -type d | sed 's/^/ - /'
            exit 1
          fi

          echo "App bundle trovato: $APP_PATH"
          if [ ! -d "$APP_PATH/PlugIns" ]; then
            echo "La cartella PlugIns non esiste nell'app bundle."
            find "$APP_PATH" -maxdepth 3 -type d | sed 's/^/ - /'
            exit 1
          fi

          echo "Contenuto PlugIns:"
          find "$APP_PATH/PlugIns" -maxdepth 2 | sed 's/^/ - /'

          APPEX_PATH=$(find "$APP_PATH/PlugIns" -type d -name "*.appex" | head -n 1)
          if [ -z "$APPEX_PATH" ]; then
            echo "Nessuna estensione .appex trovata nel bundle."
            exit 1
          fi

          echo "Estensione rilevata: $APPEX_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$APPEX_PATH/Info.plist" || true

      - name: Inspect IPA contents for extensions
        if: always() && steps.locate.outputs.ipa_path != ''
        shell: bash
        run: |
          set -euo pipefail
          IPA_PATH="${{ steps.locate.outputs.ipa_path }}"
          TMP_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TMP_DIR"

          APP_PATH=$(find "$TMP_DIR/Payload" -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle non trovato dentro l'IPA."
            find "$TMP_DIR" -maxdepth 4 | sed 's/^/ - /'
            exit 1
          fi

          echo "App bundle IPA: $APP_PATH"
          if [ ! -d "$APP_PATH/PlugIns" ]; then
            echo "Nell'IPA manca la cartella PlugIns."
            find "$APP_PATH" -maxdepth 3 | sed 's/^/ - /'
            exit 1
          fi

          echo "Contenuto PlugIns nell'IPA:"
          find "$APP_PATH/PlugIns" -maxdepth 2 | sed 's/^/ - /'

          APPEX_PATH=$(find "$APP_PATH/PlugIns" -type d -name "*.appex" | head -n 1)
          if [ -z "$APPEX_PATH" ]; then
            echo "Nell'IPA non e presente alcuna estensione .appex."
            exit 1
          fi

          echo "Estensione IPA rilevata: $APPEX_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$APPEX_PATH/Info.plist" || true
          rm -rf "$TMP_DIR"

      - name: Fail if publish did not succeed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.publish.outcome }}" != "success" ]; then
            echo "Il publish iOS non e riuscito. Controlla lo step 'Summarize publish errors' e gli artifact di log."
            exit 1
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: vault-ios-ipa
          path: ${{ steps.locate.outputs.ipa_path }}
          if-no-files-found: error

      - name: Invia IPA su Telegram
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 Nuova build IPA completata con successo!"
          document: ${{ steps.locate.outputs.ipa_path }}
